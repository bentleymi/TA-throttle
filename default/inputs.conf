[script://$SPLUNK_HOME/etc/apps/TA-throttle/bin/throttle_events.py]
interval = 300
index = main
sourcetype = throttle:status
source = status
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-throttle/bin/throttle_metrics.py]
interval = 300
index = metrics
sourcetype = throttle:metrics
source = metrics
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-throttle/bin/license_beacon.py]
interval = 3600
index = main
sourcetype = ta_license:status
source = ta_license:TA-throttle
disabled = 0
python.version = python3
python.required = 3.13
